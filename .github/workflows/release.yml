name: release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin/arm64
            goos: darwin
            goarch: arm64
          - os: ubuntu-22.04
            platform: linux/amd64
            goos: linux
            goarch: amd64
          - os: windows-latest
            platform: windows/amd64
            goos: windows
            goarch: amd64

    runs-on: ${{ matrix.os }}

    steps:
      # 兩個 repo 並排放：dataseai-gui/ 和 dataseai/
      # go.mod replace 指令用的是 ../dataseai
      - uses: actions/checkout@v4
        with:
          path: dataseai-gui

      - uses: actions/checkout@v4
        with:
          repository: cin-yi-wei/dataseai
          ref: main
          path: dataseai

      - name: Compute version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v0.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: dataseai-gui/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dataseai/web/package-lock.json

      - name: Install Linux deps
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.0-dev \
            libgtk-3-dev \
            pkg-config

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build frontend
        working-directory: dataseai/web
        run: npm ci && npm run build

      - name: Build GUI
        working-directory: dataseai-gui
        run: wails build -platform ${{ matrix.platform }}

      - name: Package (macOS)
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          NAME="DataseAI_${VER}_darwin_${{ matrix.goarch }}"
          mkdir -p "$NAME"
          APP=$(find dataseai-gui/build/bin -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: .app not found"; ls dataseai-gui/build/bin/ || true; exit 1
          fi
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          cp -r "$APP" "$NAME/"
          tar czf "${NAME}.tar.gz" "$NAME"
          echo "ASSET=${NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Linux)
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          NAME="DataseAI_${VER}_linux_amd64"
          mkdir -p "$NAME"
          BIN=$(find dataseai-gui/build/bin -maxdepth 1 -type f ! -name "*.app" | head -1)
          if [ -z "$BIN" ]; then
            echo "ERROR: binary not found"; ls dataseai-gui/build/bin/ || true; exit 1
          fi
          cp "$BIN" "$NAME/DataseAI"
          tar czf "${NAME}.tar.gz" "$NAME"
          echo "ASSET=${NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          NAME="DataseAI_${VER}_windows_amd64"
          mkdir -p "$NAME"
          EXE=$(find dataseai-gui/build/bin -maxdepth 1 -name "*.exe" | head -1)
          if [ -z "$EXE" ]; then
            echo "ERROR: .exe not found"; ls dataseai-gui/build/bin/ || true; exit 1
          fi
          cp "$EXE" "$NAME/DataseAI.exe"
          7z a "${NAME}.zip" "$NAME"
          echo "ASSET=${NAME}.zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: ${{ env.ASSET }}
