<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DataseAI</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  display: flex; align-items: center; justify-content: center;
  height: 100vh; background: #1a1a1a; color: #e0e0e0;
  font-family: system-ui, -apple-system, sans-serif;
}
.wrap { text-align: center; }
.logo { font-size: 32px; font-weight: 700; color: #4c9be8; margin-bottom: 12px; }
.sub  { font-size: 14px; color: #888; }
.dot  { display: inline-block; animation: blink 1.2s infinite; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">DataseAI</div>
  <div class="sub">Starting<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
</div>
</body>
</html>
